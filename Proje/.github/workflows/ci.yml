name: Karar Destek Sistemi CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Python 3.10 Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install pytest pydantic streamlit
        
    - name: Testleri Çalıştır
      run: |
        pytest testler/
